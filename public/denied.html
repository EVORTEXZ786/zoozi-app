<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied — zoozi.app</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0814;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .denied {
    text-align: center;
    padding: 40px;
  }
  .denied-icon {
    font-size: 64px;
    margin-bottom: 20px;
    opacity: 0.6;
  }
  .denied h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 12px;
    color: #ef4444;
  }
  .denied p {
    font-size: 14px;
    color: #8a879e;
    margin-bottom: 24px;
  }
  .denied a {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .denied a:hover {
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="denied">
    <div class="denied-icon">&#128274;</div>
    <h1>Access Denied</h1>
    <p>You need a valid token to access this page.<br>Contact the administrator for access.</p>
    <a href="/">Back to zoozi.app</a>
  </div>
</body>
</html>
