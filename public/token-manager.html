<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Manager — zoozi.app</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0814;
    --card: #110e1f;
    --card-hover: #16122a;
    --pill: #1a1530;
    --text: #ffffff;
    --dim: #6b6880;
    --red: #ef4444;
    --blue: #3b82f6;
    --green: #22c55e;
    --gold: #facc15;
    --border: rgba(59, 130, 246, 0.15);
    --border-hover: rgba(59, 130, 246, 0.4);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== ANIMATED BACKGROUND ===== */
  .bg-glow {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    pointer-events: none;
  }
  .bg-glow::before {
    content: '';
    position: absolute;
    top: -30%; left: -20%;
    width: 60%; height: 80%;
    background: radial-gradient(ellipse, rgba(239, 68, 68, 0.07) 0%, transparent 70%);
    animation: drift1 25s ease-in-out infinite;
  }
  .bg-glow::after {
    content: '';
    position: absolute;
    bottom: -20%; right: -10%;
    width: 50%; height: 70%;
    background: radial-gradient(ellipse, rgba(59, 130, 246, 0.07) 0%, transparent 70%);
    animation: drift2 30s ease-in-out infinite reverse;
  }
  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(5%, 3%) scale(1.1); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-4%, -2%) scale(1.08); }
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* ===== LOGIN ===== */
  .login-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 44px 40px;
    width: 400px;
    text-align: center;
    animation: fadeUp 0.5s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    transition: all 0.3s;
  }
  .login-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(59, 130, 246, 0.08);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .login-card .icon-wrap {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--red), var(--blue));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 20px;
    box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
  }
  .login-card h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .login-card h1 span {
    background: linear-gradient(135deg, var(--red), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-card p { font-size: 13px; color: var(--dim); margin-bottom: 28px; }
  .login-card input {
    width: 100%;
    padding: 13px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--pill);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 18px;
    transition: all 0.25s;
  }
  .login-card input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
  }
  .login-card input::placeholder { color: var(--dim); }
  .login-card .btn-unlock {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--blue), #6366f1);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s;
    letter-spacing: 0.3px;
  }
  .login-card .btn-unlock:hover {
    box-shadow: 0 0 24px rgba(59, 130, 246, 0.4);
    transform: translateY(-1px);
  }
  .login-card .btn-unlock:active { transform: scale(0.98); }
  .login-error {
    color: var(--red);
    font-size: 12px;
    margin-bottom: 14px;
    display: none;
    animation: shake 0.3s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ===== DASHBOARD ===== */
  .dashboard { display: none; }
  .dashboard.active { display: block; }
  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    animation: fadeDown 0.4s ease;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .dash-header h2 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .dash-header h2 span {
    background: linear-gradient(135deg, var(--red), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .dash-header a {
    color: var(--dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: color 0.2s;
  }
  .dash-header a:hover { color: var(--text); }
  .dash-body { padding: 32px; max-width: 820px; margin: 0 auto; }

  /* Cards */
  .gen-card, .list-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 20px;
    animation: cardIn 0.4s ease backwards;
    transition: all 0.3s;
  }
  .gen-card { animation-delay: 0.05s; }
  .list-card { animation-delay: 0.1s; }
  .gen-card:hover, .list-card:hover {
    border-color: var(--border-hover);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .gen-card h3, .list-card h3 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 18px;
    color: var(--blue);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Form */
  .gen-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .gen-row > * { flex: 1; }
  .gen-row label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .gen-row input, .gen-row select {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--pill);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: all 0.25s;
  }
  .gen-row input:focus, .gen-row select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
  }
  .gen-row input::placeholder { color: var(--dim); }
  .gen-btn {
    padding: 11px 28px;
    border-radius: 10px;
    border: none;
    background: var(--green);
    color: #000;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .gen-btn:hover { box-shadow: 0 0 16px rgba(34, 197, 94, 0.35); transform: translateY(-1px); }
  .gen-btn:active { transform: scale(0.97); }

  /* Token Display */
  .token-display {
    display: none;
    margin-top: 18px;
    padding: 18px;
    background: rgba(34, 197, 94, 0.06);
    border: 1px solid rgba(34, 197, 94, 0.25);
    border-radius: 14px;
    animation: fadeUp 0.3s ease;
  }
  .token-display .td-label { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
  .token-display .td-value {
    color: var(--green);
    font-weight: 700;
    font-family: 'SF Mono', monospace;
    font-size: 14px;
    word-break: break-all;
    margin-bottom: 12px;
  }
  .token-display .td-url {
    color: var(--dim);
    font-size: 11px;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .token-display .td-url span { color: var(--gold); font-weight: 600; }

  /* Token List */
  .token-table {
    width: 100%;
    border-collapse: collapse;
  }
  .token-table th {
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .token-table td {
    padding: 12px;
    font-size: 13px;
    border-bottom: 1px solid rgba(59, 130, 246, 0.05);
    vertical-align: middle;
  }
  .token-table tr {
    transition: background 0.15s;
  }
  .token-table tbody tr:hover {
    background: rgba(59, 130, 246, 0.04);
  }
  .token-mono {
    font-family: 'SF Mono', monospace;
    font-size: 12px;
    color: var(--green);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .type-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .type-badge.overlay { background: rgba(59, 130, 246, 0.12); color: var(--blue); }
  .type-badge.admin { background: rgba(250, 204, 21, 0.12); color: var(--gold); }
  .revoke-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid rgba(239, 68, 68, 0.4);
    background: transparent;
    color: var(--red);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .revoke-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }
  .empty-msg {
    text-align: center;
    padding: 36px;
    color: var(--dim);
    font-size: 13px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    padding: 14px 24px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 13px;
    font-weight: 700;
    z-index: 999;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { opacity: 1; transform: translateY(0) scale(1); }
  .toast.error { border-color: var(--red); color: var(--red); }

  @media (max-width: 500px) {
    .login-card { width: 92%; padding: 32px 24px; }
    .gen-row { flex-direction: column; }
    .dash-body { padding: 20px 16px; }
  }
</style>
</head>
<body>

<div class="bg-glow" id="bg-glow"></div>

<!-- Login -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="icon-wrap">&#128272;</div>
    <h1><span>Token Manager</span></h1>
    <p>Enter master password to manage access tokens</p>
    <div class="login-error" id="login-error">Invalid password</div>
    <input type="password" id="login-pw" placeholder="Master password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-unlock" onclick="doLogin()">&#128275; Unlock</button>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h2>&#128273; <span>Token Manager</span></h2>
    <a href="/">&larr; Back to zoozi.app</a>
  </div>
  <div class="dash-body">
    <div class="gen-card">
      <h3>&#10024; Generate New Token</h3>
      <div class="gen-row">
        <div>
          <label>Label</label>
          <input type="text" id="gen-label" placeholder="e.g. My Overlay">
        </div>
        <div>
          <label>Type</label>
          <select id="gen-type">
            <option value="overlay">Overlay</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <button class="gen-btn" onclick="generateToken()">&#10003; Generate Token</button>
      <div class="token-display" id="token-display">
        <div class="td-label">Token generated:</div>
        <div class="td-value" id="token-value"></div>
        <div class="td-url">Overlay: <span id="token-url-overlay"></span></div>
        <div class="td-url">Admin: <span id="token-url-admin"></span></div>
      </div>
    </div>

    <div class="list-card">
      <h3>&#128203; All Tokens</h3>
      <div id="token-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast">&#10003; Done!</div>

<script>
// Stars
const bgEl = document.getElementById('bg-glow');
for (let i = 0; i < 50; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = (Math.random() * 5) + 's';
  s.style.animationDuration = (2 + Math.random() * 4) + 's';
  s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
  bgEl.appendChild(s);
}

let masterPw = "";

function doLogin() {
  masterPw = document.getElementById("login-pw").value;
  fetch("/api/tokens/list", {
    headers: { "X-Master-Password": masterPw }
  })
  .then(r => { if (!r.ok) throw "bad"; return r.json(); })
  .then(data => {
    document.getElementById("login-wrap").style.display = "none";
    document.getElementById("dashboard").classList.add("active");
    renderTokens(data.tokens);
  })
  .catch(() => {
    const err = document.getElementById("login-error");
    err.style.display = "block";
    err.style.animation = "none";
    void err.offsetWidth;
    err.style.animation = "shake 0.3s ease";
  });
}

function toast(msg, isError) {
  const el = document.getElementById("toast");
  el.innerHTML = (isError ? "&#10007; " : "&#10003; ") + msg;
  el.className = "toast" + (isError ? " error" : "");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2500);
}

function generateToken() {
  const label = document.getElementById("gen-label").value.trim() || "Unnamed";
  const type = document.getElementById("gen-type").value;
  fetch("/api/tokens/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Master-Password": masterPw },
    body: JSON.stringify({ label, type })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      document.getElementById("token-value").textContent = data.token;
      document.getElementById("token-url-overlay").textContent = location.origin + "/overlay?token=" + data.token;
      document.getElementById("token-url-admin").textContent = location.origin + "/admin?token=" + data.token;
      document.getElementById("token-display").style.display = "block";
      document.getElementById("gen-label").value = "";
      toast("Token created!");
      refreshList();
    }
  });
}

function revokeToken(token) {
  if (!confirm("Revoke this token?")) return;
  fetch("/api/tokens/revoke", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Master-Password": masterPw },
    body: JSON.stringify({ token })
  })
  .then(r => r.json())
  .then(() => { toast("Token revoked"); refreshList(); });
}

function refreshList() {
  fetch("/api/tokens/list", {
    headers: { "X-Master-Password": masterPw }
  })
  .then(r => r.json())
  .then(data => renderTokens(data.tokens));
}

function renderTokens(tokens) {
  const el = document.getElementById("token-list");
  if (!tokens || !tokens.length) {
    el.innerHTML = '<div class="empty-msg">No tokens yet. Generate one above.</div>';
    return;
  }
  el.innerHTML = '<table class="token-table"><thead><tr><th>Label</th><th>Type</th><th>Token</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody>' +
    tokens.map(t => '<tr>' +
      '<td>' + esc(t.label) + '</td>' +
      '<td><span class="type-badge ' + t.type + '">' + t.type + '</span></td>' +
      '<td class="token-mono" title="' + t.token + '">' + t.token + '</td>' +
      '<td style="color:var(--dim);font-size:12px;">' + new Date(t.created).toLocaleDateString() + '</td>' +
      '<td style="color:' + (t.active ? 'var(--green)' : 'var(--red)') + ';font-weight:600;font-size:12px;">' + (t.active ? 'Active' : 'Revoked') + '</td>' +
      '<td>' + (t.active ? '<button class="revoke-btn" onclick="revokeToken(\'' + t.token + '\')">Revoke</button>' : '') + '</td>' +
    '</tr>').join('') +
    '</tbody></table>';
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
